apply plugin: 'com.android.application'
android {
    namespace 'com.example.dockoverlay'
    compileSdk 34
    defaultConfig {
        applicationId "com.example.dockoverlay"
        minSdk 28
        targetSdk 34
        versionCode 1
        versionName "0.1.0"
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
dependencies {
    // 只保留 RecyclerView（横向列表 + ItemTouchHelper）；其余用原生 Android API，依赖树最小
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
}
